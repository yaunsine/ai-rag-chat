[project]
name = "mom-chat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.119.0",
    "llama-index>=0.14.4",
    "llama-index-embeddings-huggingface>=0.6.1",
    "llama-index-llms-deepseek>=0.2.2",
    "llama-index-llms-openai-like>=0.5.3",
    "llama-index-vector-stores-milvus>=1.2.0",
    "pymilvus>=2.6.17",
    "milvus-lite>=3.2.2",
    "jieba>=0.42.1",
    "bm25s>=0.3.13",
    "sentence-transformers>=5.1.1",
    "modelscope>=1.31.0",
    "mom-chat",
    "uvicorn>=0.37.0",
]
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["hatchling"]  # uv 推荐使用 hatchling
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["."]  # 包含当前目录的所有Python文件
