<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 聊天界面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        .chat-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .chat-header {
            background-color: #007bff;
            color: white;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .message {
            display: flex;
            margin-bottom: 15px;
            align-items: flex-start;
        }
        .user-message {
            justify-content: flex-end;
        }
        .assistant-message {
            justify-content: flex-start;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin: 0 10px;
        }
        .user-avatar {
            background-color: #007bff;
            color: white;
        }
        .assistant-avatar {
            background-color: #28a745;
            color: white;
        }
        .message-content {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 15px;
            word-wrap: break-word;
        }
        .user-message .message-content {
            background-color: #e3f2fd;
            border-bottom-right-radius: 5px;
        }
        .assistant-message .message-content {
            background-color: #f1f1f1;
            border-bottom-left-radius: 5px;
        }
        .input-container {
            padding: 15px;
            border-top: 1px solid #ddd;
            background-color: white;
        }
        .typing-indicator {
            display: none;
            padding: 10px;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h4 class="mb-0"><i class="fas fa-robot"></i> RAG 智能助手</h4>
                    <small>基于文档检索的智能问答系统</small>
                </div>
                <button class="btn btn-sm btn-outline-light" id="updateIndexBtn" title="更新索引以包含新文件">
                    <i class="fas fa-sync-alt"></i> 更新索引
                </button>
            </div>
        </div>
        
        <div class="messages-container" id="messagesContainer">
            <div class="text-center text-muted mt-5" id="welcomeMessage">
                <i class="fas fa-comments fa-3x mb-3"></i>
                <p>欢迎使用 RAG 智能助手！请输入您的问题开始对话。</p>
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator">
            <i class="fas fa-ellipsis-h"></i> 助手正在思考...
        </div>
        
        <div class="input-container">
            <div class="input-group">
                <input type="text" class="form-control" id="userInput" 
                       placeholder="请输入您的问题..." autocomplete="off">
                <button class="btn btn-primary" id="sendButton">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = "";
        
        // DOM 元素
        const messagesContainer = document.getElementById('messagesContainer');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');
        const welcomeMessage = document.getElementById('welcomeMessage');
        const updateIndexBtn = document.getElementById('updateIndexBtn');
        
        // 添加消息到聊天界面
        function addMessage(role, content) {
            if (welcomeMessage) {
                welcomeMessage.style.display = 'none';
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}-message`;
            
            const avatarDiv = document.createElement('div');
            avatarDiv.className = `avatar ${role}-avatar`;
            avatarDiv.innerHTML = role === 'user' ? '👤' : '🤖';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = content.replace(/\n/g, '<br>');
            
            if (role === 'user') {
                messageDiv.appendChild(contentDiv);
                messageDiv.appendChild(avatarDiv);
            } else {
                messageDiv.appendChild(avatarDiv);
                messageDiv.appendChild(contentDiv);
            }
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        // 显示输入指示器
        function showTypingIndicator() {
            typingIndicator.style.display = 'block';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        // 隐藏输入指示器
        function hideTypingIndicator() {
            typingIndicator.style.display = 'none';
        }
        
        // 添加流式消息
        function addStreamingMessage(role) {
            if (welcomeMessage) {
                welcomeMessage.style.display = 'none';
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}-message`;
            messageDiv.id = `streaming-${Date.now()}`;
            
            const avatarDiv = document.createElement('div');
            avatarDiv.className = `avatar ${role}-avatar`;
            avatarDiv.innerHTML = role === 'user' ? '👤' : '🤖';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.id = `content-${Date.now()}`;
            
            if (role === 'user') {
                messageDiv.appendChild(contentDiv);
                messageDiv.appendChild(avatarDiv);
            } else {
                messageDiv.appendChild(avatarDiv);
                messageDiv.appendChild(contentDiv);
            }
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            return contentDiv;
        }
        
        // 发送消息（流式版本）
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;
            
            // 添加用户消息
            const userContentDiv = addStreamingMessage('user');
            userContentDiv.innerHTML = message.replace(/\n/g, '<br>');
            userInput.value = '';
            
            // 显示输入指示器
            showTypingIndicator();
            
            try {
                // 添加助手消息容器
                const assistantContentDiv = addStreamingMessage('assistant');
                
                // 发送流式请求到后端
                const response = await fetch(`${API_BASE}/stream-query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: message
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                // 处理流式响应
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let accumulatedText = '';
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    accumulatedText += chunk;
                    
                    // 更新显示内容
                    assistantContentDiv.innerHTML = accumulatedText.replace(/\n/g, '<br>');
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
                
                // 隐藏输入指示器
                hideTypingIndicator();
                
            } catch (error) {
                hideTypingIndicator();
                const assistantContentDiv = addStreamingMessage('assistant');
                assistantContentDiv.innerHTML = `抱歉，发生了错误：${error.message}`;
                console.error('Error:', error);
            }
        }
        
        // 更新索引
        async function updateIndex() {
            updateIndexBtn.disabled = true;
            updateIndexBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 更新中...';
            
            try {
                const response = await fetch(`${API_BASE}/update-index`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                showAlert(`索引更新成功！加载了 ${result.documents_count} 个文档`, 'success');
                
            } catch (error) {
                showAlert(`索引更新失败：${error.message}`, 'danger');
                console.error('Error:', error);
            } finally {
                updateIndexBtn.disabled = false;
                updateIndexBtn.innerHTML = '<i class="fas fa-sync-alt"></i> 更新索引';
            }
        }
        
        // 显示提示信息
        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
            alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 1050; min-width: 300px;';
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            document.body.appendChild(alertDiv);
            
            // 5秒后自动消失
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.parentNode.removeChild(alertDiv);
                }
            }, 5000);
        }
        
        // 事件监听
        sendButton.addEventListener('click', sendMessage);
        updateIndexBtn.addEventListener('click', updateIndex);
        
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        // 页面加载时聚焦输入框
        window.addEventListener('load', () => {
            userInput.focus();
        });
    </script>
</body>
</html>
